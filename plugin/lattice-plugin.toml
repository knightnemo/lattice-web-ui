schema = 1
id = "io.github.knightnemo.lattice-remote"
name = "Remote Workspace"
version = "0.1.0"
api = 1
license = "MIT"
description = "Open your private Lattice workspace served by a Linux host."
runtime = "node"
main = "main.mjs"

[[commands]]
id = "configure"
title = "Set workspace address…"
description = "Save the private HTTPS address of a Lattice Remote host."
input = { kind = "text", placeholder = "https://your-machine.example.ts.net:8443" }

[[commands]]
id = "open"
title = "Open remote workspace"
description = "Open your configured remote workspace in the browser."

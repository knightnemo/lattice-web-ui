name: Agent issue intake

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Number of the open issue labeled agent-ready
        required: true
        type: string
      dry_run:
        description: Check eligibility and deduplication without model use or GitHub writes
        default: false
        type: boolean

permissions: {}

concurrency:
  group: issue-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  intake:
    name: Validate the issue
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.actor == github.event.repository.owner.login
      && github.triggering_actor == github.event.repository.owner.login
      && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: node automation/agent-issue.mjs plan

  propose:
    name: Propose an allowlisted patch
    needs: intake
    if: needs.intake.outputs.mode == 'new'
    environment: agent-implementation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LATTICE_AGENT_MODEL: ${{ vars.LATTICE_AGENT_MODEL }}
        run: node automation/agent-issue.mjs propose "$RUNNER_TEMP/proposal.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: issue-proposal
          path: ${{ runner.temp }}/proposal.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  publish:
    name: Open or resume the draft PR
    needs: [intake, propose]
    if: >-
      !cancelled() &&
      (needs.intake.outputs.mode == 'resume' ||
      (needs.intake.outputs.mode == 'new' && needs.propose.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - if: needs.intake.outputs.mode == 'new'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: issue-proposal
          path: ${{ runner.temp }}
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node automation/agent-issue.mjs publish "$RUNNER_TEMP/proposal.json"

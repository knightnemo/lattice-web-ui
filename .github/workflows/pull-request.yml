name: PR verification

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true
        type: string
      head_sha:
        description: Exact PR head commit
        required: true
        type: string

permissions: {}

concurrency:
  group: verify-${{ inputs.pr_number }}-${{ inputs.head_sha }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.repository == 'lattice-writer/lattice-web-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.plan.outputs.head }}
      number: ${{ steps.plan.outputs.number }}
      packaging: ${{ steps.plan.outputs.packaging }}
      layout: ${{ steps.plan.outputs.layout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
        run: node automation/pr-ci.mjs plan

  verify:
    name: Verify tests and packages
    needs: plan
    if: needs.plan.outputs.head != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ needs.plan.outputs.number }}/head
          path: proposal
          persist-credentials: false
      - name: Verify exact PR commit
        working-directory: proposal
        env:
          EXPECTED_HEAD: ${{ needs.plan.outputs.head }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Test the gateway and host kit
        working-directory: proposal
        run: |
          mkdir -p "$RUNNER_TEMP/lattice-pr"
          git show --check --format= HEAD
          bash -n scripts/package.sh
          cargo fmt --manifest-path gateway/Cargo.toml --check
          cargo clippy --locked --manifest-path gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path gateway/Cargo.toml
          cargo build --locked --release --manifest-path gateway/Cargo.toml
          python3 test/host_kit.py
          LATTICE_GATEWAY_BINARY="$PWD/gateway/target/release/lattice-gateway" \
            node --test test/*.test.mjs | tee "$RUNNER_TEMP/lattice-pr/tests.tap"
        shell: bash
      - name: Check plugin archive
        if: needs.plan.outputs.packaging == 'true'
        working-directory: proposal
        run: |
          node scripts/pack-plugin.mjs plugin "$RUNNER_TEMP/lattice-plugin-pr.zip"
          unzip -t "$RUNNER_TEMP/lattice-plugin-pr.zip"
      - name: Check Linux host kit
        if: needs.plan.outputs.packaging == 'true'
        working-directory: proposal
        run: |
          LATTICE_GATEWAY_BINARY="$PWD/gateway/target/release/lattice-gateway" bash scripts/package.sh "$RUNNER_TEMP/lattice-pack"
          cd "$RUNNER_TEMP/lattice-pack"
          sha256sum --check SHA256SUMS
          for archive in lattice-remote-host-*.tar.gz; do
            tar -tzf "$archive" | sort > "$RUNNER_TEMP/lattice-pr/host-kit-contents.txt"
            tar -xOzf "$archive" --wildcards '*/bin/lattice-gateway' > "$RUNNER_TEMP/gateway" && chmod +x "$RUNNER_TEMP/gateway"
            "$RUNNER_TEMP/gateway" --version
          done
      - name: Record checks
        if: always()
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head }}
          PACKAGING: ${{ needs.plan.outputs.packaging }}
          LAYOUT: ${{ needs.plan.outputs.layout }}
        run: |
          mkdir -p "$RUNNER_TEMP/lattice-pr"
          {
            printf 'head=%s\n' "$HEAD_SHA"
            printf 'plugin_packaging_selected=%s\n' "$PACKAGING"
            printf 'layout=%s\n' "$LAYOUT"
          } >> "$RUNNER_TEMP/lattice-pr/metadata.txt"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-verification
          path: ${{ runner.temp }}/lattice-pr/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish required check on PR head
    if: >-
      ${{ !cancelled()
      && github.repository == 'lattice-writer/lattice-web-ui'
      && github.ref == 'refs/heads/main' }}
    needs: [plan, verify]
    outputs:
      requeue: ${{ steps.publish.outputs.requeue }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: node automation/pr-ci.mjs publish

  requeue:
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.requeue == 'true' }}
    permissions:
      actions: write
    uses: ./.github/workflows/queue-pr-verification.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}

  review:
    if: needs.plan.outputs.head != ''
    needs: plan
    uses: ./.github/workflows/pr-review.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      pr_number: ${{ needs.plan.outputs.number }}
      head_sha: ${{ needs.plan.outputs.head }}
